<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yshme</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    .fullscreen-bg {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* 이미지를 화면에 맞게 꽉 채움 (비율 유지) */
      display: block;
    }
  </style>
</head>
<body>
  <!-- 저장소에 올려둔 이미지 파일명으로 경로 작성 -->
  <img src="./image.jpg" alt="Background" class="fullscreen-bg">
</body>
</html>
