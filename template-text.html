<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yshme</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@600;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d1117; /* 배경색 (원하는 색상으로 변경 가능) */
      color: #ffffff;            /* 글자색 */
      font-family: Pretendard, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 5rem);
      line-height: 1.3;
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <!-- 아래 원하는 문구를 작성하면 됩니다 -->
  <h1>시스템 점검 중입니다.<br>곧 새로운 연구 기록으로 찾아뵙겠습니다.</h1>
</body>
</html>
